apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: support-agents
  labels:
    app.kubernetes.io/name: support-agents
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: support-agents
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
