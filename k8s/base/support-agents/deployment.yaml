# FastAPI service hosting the LangGraph support agents (optionally calls an external LLM API).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-agents
  labels:
    app.kubernetes.io/name: support-agents
    app.kubernetes.io/component: api
spec:
  # Single replica on purpose: conversation checkpoints live in a per-pod SQLite file, so a
  # second replica would not see the first one's threads. Scale out after moving the
  # checkpointer to Postgres (see README > Decisions).
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: support-agents
  template:
    metadata:
      labels:
        app.kubernetes.io/name: support-agents
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: support-agents
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: support-agents
      containers:
        - name: support-agents
          image: ghcr.io/pulso/pulso-support-agents:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: support-agents-config
            - secretRef:
                name: support-agents-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # startupProbe gates the other two, so slow boots (migrations, model warm-up)
          # never get killed by the liveness probe.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            # Give ingress-nginx and kube-proxy time to drop the endpoint before SIGTERM.
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        # SQLite checkpoints (PULSO_CHECKPOINT_DB): survive container restarts, not rescheduling.
        - name: data
          emptyDir:
            sizeLimit: 256Mi
