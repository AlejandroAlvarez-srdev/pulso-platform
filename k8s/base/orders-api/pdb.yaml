apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orders-api
  labels:
    app.kubernetes.io/name: orders-api
spec:
  # maxUnavailable (not minAvailable) so a single-replica dev deployment can still be drained.
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-api
