apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pulso

labels:
  - pairs:
      app.kubernetes.io/part-of: pulso
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
    includeTemplates: true

resources:
  - namespace.yaml
  - network-policies.yaml
  - ingress.yaml
  - orders-api/serviceaccount.yaml
  - orders-api/deployment.yaml
  - orders-api/service.yaml
  - orders-api/hpa.yaml
  - orders-api/pdb.yaml
  - orders-api/migrate-job.yaml
  - matching/serviceaccount.yaml
  - matching/deployment.yaml
  - matching/service.yaml
  - matching/hpa.yaml
  - matching/pdb.yaml
  - support-agents/serviceaccount.yaml
  - support-agents/deployment.yaml
  - support-agents/service.yaml
  - support-agents/pdb.yaml
  - saga/serviceaccount.yaml
  - saga/deployment.yaml
  - saga/service.yaml
  - saga/pdb.yaml

# Non-secret runtime configuration, limited to variables the services actually read.
# Generated names carry a content hash, so changing a value rolls the Deployments.
configMapGenerator:
  - name: orders-api-config
    literals:
      - PORT=3000
      - NODE_ENV=production
      - PERSISTENCE=prisma
      - JWT_ISSUER=pulso-orders-api
      - JWT_TTL_SECONDS=3600
      # ~75% of the memory limit; keeps V8 below the cgroup limit instead of getting OOMKilled.
      - NODE_OPTIONS=--max-old-space-size=288
  - name: matching-config
    literals:
      # The image starts uvicorn on :8000; WEB_CONCURRENCY sets its worker count.
      - WEB_CONCURRENCY=2
      - PULSO_MAX_RADIUS_KM=8
      - PULSO_MAX_ETA_MINUTES=45
  - name: support-agents-config
    literals:
      # "scripted" is the offline deterministic model; prod switches to a real provider.
      - PULSO_LLM_PROVIDER=scripted
      - PULSO_MAX_AGENT_STEPS=6
      - PULSO_REFUND_THRESHOLD_CENTS=50000
      - PULSO_CHECKPOINT_DB=/data/threads.sqlite
      # One worker: SQLite has a single writer.
      - WEB_CONCURRENCY=1
  - name: saga-config
    literals:
      - PORT=8090
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=192
      - STEP_TIMEOUT_MS=15000
      - MAX_COMPENSATION_ATTEMPTS=5
