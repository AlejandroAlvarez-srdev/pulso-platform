# Single-node kind cluster prepared for ingress-nginx (kind provider manifest):
# the node is labelled ingress-ready and ports 80/443 are published on localhost.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: pulso
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
