# External Secrets Operator: prod Secrets come from AWS Secrets Manager instead of git.
# ESO (installed cluster-wide by the platform team) authenticates with IRSA: this
# ServiceAccount maps to an IAM role that can only read the pulso/prod/* secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-reader
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/pulso-prod-secrets-reader
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-reader
