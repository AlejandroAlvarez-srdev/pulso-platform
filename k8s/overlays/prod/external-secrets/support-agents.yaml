# Materialises the Secret "support-agents-secrets" that the base manifests reference.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: support-agents-secrets
  annotations:
    # Argo CD waits for the ExternalSecret to be healthy (Secret written) before wave -1.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: support-agents-secrets
    creationPolicy: Owner
    # Keep the last good Secret if the ExternalSecret is deleted by mistake.
    deletionPolicy: Retain
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: pulso/prod/support-agents
        property: ANTHROPIC_API_KEY
