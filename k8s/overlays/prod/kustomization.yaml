apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Repeated here so generator merges resolve against the base objects' namespace.
namespace: pulso

resources:
  - ../../base
  # Secrets come from AWS Secrets Manager through External Secrets Operator.
  - external-secrets/secret-store.yaml
  - external-secrets/orders-api.yaml
  - external-secrets/support-agents.yaml
  - external-secrets/saga.yaml

# Immutable release tags; CI bumps these (never "latest").
images:
  - name: ghcr.io/pulso/pulso-orders-api
    newTag: 1.4.2
  # Same release as orders-api: the migration image is its build stage.
  - name: ghcr.io/pulso/pulso-orders-api-migrate
    newTag: 1.4.2
  - name: ghcr.io/pulso/pulso-matching
    newTag: 0.9.1
  - name: ghcr.io/pulso/pulso-support-agents
    newTag: 0.6.0
  - name: ghcr.io/pulso/pulso-saga
    newTag: 1.1.0

# saga has a fixed count; orders-api and matching are sized by their HPAs and
# support-agents stays at one replica (see its Deployment).
replicas:
  - name: saga
    count: 2

patches:
  - path: patches/hpa.yaml
    target:
      kind: HorizontalPodAutoscaler
  - path: patches/orders-api.yaml
  - path: patches/matching.yaml
  - path: patches/support-agents.yaml
  - path: patches/saga.yaml
  - path: patches/ingress.yaml
    target:
      kind: Ingress
      name: pulso-public
  # Same host, no TLS block or issuer of its own: ingress-nginx serves the host's
  # certificate from pulso-public, and cert-manager sees a single owner for the Secret.
  - path: patches/ingress-blocked-paths.yaml
    target:
      kind: Ingress
      name: pulso-public-blocked-paths
  - path: patches/postgres-egress.yaml
    target:
      kind: NetworkPolicy
      name: orders-api-postgres-egress
  - path: patches/reloader.yaml
    target:
      kind: Deployment
  - path: patches/redis-egress.yaml
    target:
      kind: NetworkPolicy
      name: saga-redis-egress

# Heap caps follow the larger memory limits (~75%).
configMapGenerator:
  - name: orders-api-config
    behavior: merge
    literals:
      - NODE_OPTIONS=--max-old-space-size=576
  - name: matching-config
    behavior: merge
    literals:
      - WEB_CONCURRENCY=4
  - name: support-agents-config
    behavior: merge
    literals:
      - PULSO_LLM_PROVIDER=anthropic
  - name: saga-config
    behavior: merge
    literals:
      - NODE_OPTIONS=--max-old-space-size=288
