apiVersion: apps/v1
kind: Deployment
metadata:
  name: saga
spec:
  template:
    spec:
      # Spread replicas across zones first, then nodes (anti-affinity in base).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: saga
      containers:
        - name: saga
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
