# Prod has no in-cluster Postgres/Redis: allow egress to the private subnet where the
# managed instances live (placeholder CIDR, one per environment in a real setup).
- op: replace
  path: /spec/egress
  value:
    - to:
        - ipBlock:
            cidr: 10.40.0.0/20
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
