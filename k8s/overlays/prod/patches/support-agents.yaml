apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-agents
spec:
  template:
    spec:
      # Spread replicas across zones first, then nodes (anti-affinity in base).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: support-agents
      containers:
        - name: support-agents
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
