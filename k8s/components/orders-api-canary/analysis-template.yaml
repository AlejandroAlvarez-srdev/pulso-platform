# Canary success rate from Prometheus. Needs the metrics contract (http_requests_total) and
# the ServiceMonitor's podTargetLabels, which tag each series with the pod-template hash.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: orders-api-success-rate
spec:
  args:
    - name: canary-hash
  metrics:
    - name: success-rate
      interval: 1m
      # Two bad minutes abort the rollout; no data (inconclusive) counts against it too.
      failureLimit: 2
      inconclusiveLimit: 2
      successCondition: len(result) > 0 && result[0] >= 0.99
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
          query: |
            sum(rate(http_requests_total{namespace="pulso", job="orders-api",
              rollouts_pod_template_hash="{{args.canary-hash}}", status!~"5.."}[2m]))
            /
            sum(rate(http_requests_total{namespace="pulso", job="orders-api",
              rollouts_pod_template_hash="{{args.canary-hash}}"}[2m]))
