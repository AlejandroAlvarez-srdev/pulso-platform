# Monitoring objects for the Pulso namespace. Needs the CRDs and Grafana sidecar from
# kube-prometheus-stack (observability/kube-prometheus-stack/values.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pulso

resources:
  - service-monitors.yaml
  - prometheus-rules.yaml

# Grafana's dashboard sidecar loads every ConfigMap labelled grafana_dashboard=1.
configMapGenerator:
  - name: grafana-dashboard-pulso-red
    files:
      - dashboards/pulso-red.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
