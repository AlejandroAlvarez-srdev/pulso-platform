extends: default

ignore: |
  rendered/
  .venv/
  # Go templates, validated by helm lint / helm template instead.
  charts/*/templates/

rules:
  document-start: disable
  line-length:
    max: 180
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  indentation:
    spaces: 2
    indent-sequences: consistent
