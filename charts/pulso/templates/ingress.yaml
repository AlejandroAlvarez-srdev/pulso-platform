{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulso-public
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "pulso.labels" (list $ "pulso-public") | nindent 4 }}
  annotations:
    # /api/orders/health -> /health on orders-api, and so on.
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: "/$2"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ required "ingress.tls.secretName is required with TLS" .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- range $name, $svc := .Values.services }}
          {{- if and $svc.enabled $svc.ingressPath }}
          {{- /* Services with metrics: true keep /metrics off the public route (default backend, 404). */}}
          {{- if $svc.metrics }}
          - path: {{ printf "%s(/|$)(?!metrics(?:/|$))(.*)" $svc.ingressPath | quote }}
          {{- else }}
          - path: {{ printf "%s(/|$)(.*)" $svc.ingressPath | quote }}
          {{- end }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
          {{- end }}
          {{- end }}
{{- end }}
