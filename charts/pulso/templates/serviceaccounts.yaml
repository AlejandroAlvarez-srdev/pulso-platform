{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "pulso.labels" (list $ $name) | nindent 4 }}
# The services never talk to the Kubernetes API, so no token is mounted.
automountServiceAccountToken: false
{{- end }}
{{- end }}
