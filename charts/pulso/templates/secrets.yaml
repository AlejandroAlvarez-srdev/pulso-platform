{{- if eq .Values.secrets.mode "generated" }}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.secretKeys }}
{{- $values := index $.Values.secrets.generated $name | default dict }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-secrets
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "pulso.labels" (list $ $name) | nindent 4 }}
type: Opaque
stringData:
  {{- range $svc.secretKeys }}
  {{ . }}: {{ required (printf "secrets.generated.%s.%s is required when secrets.mode=generated" $name .) (index $values .) | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- else if eq .Values.secrets.mode "external" }}
{{- $store := .Values.secrets.external.store }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-reader
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "pulso.labels" (list $ "external-secrets-reader") | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "secrets.external.store.roleArn is required" $store.roleArn }}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $store.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "pulso.labels" (list $ $store.name) | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ $store.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-reader
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.secretKeys }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-secrets
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "pulso.labels" (list $ $name) | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.secrets.external.refreshInterval }}
  secretStoreRef:
    name: {{ $store.name }}
    kind: SecretStore
  target:
    name: {{ $name }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $svc.secretKeys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ printf "%s/%s" $.Values.secrets.external.keyPrefix $name }}
        property: {{ . }}
    {{- end }}
{{- end }}
{{- end }}
{{- else }}
{{- fail "secrets.mode must be \"generated\" or \"external\"" }}
{{- end }}
