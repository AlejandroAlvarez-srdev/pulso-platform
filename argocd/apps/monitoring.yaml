# kube-prometheus-stack for the prod cluster, values from this repo (multi-source).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    # Before the Pulso apps, so the ServiceMonitor/PrometheusRule CRDs exist.
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: pulso
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 65.1.1
      helm:
        valueFiles:
          - $values/observability/kube-prometheus-stack/values.yaml
    - repoURL: https://github.com/pulso/pulso-platform.git
      targetRevision: prod
      ref: values
  destination:
    name: prod
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The Prometheus Operator CRDs exceed the client-side apply annotation size limit.
      - ServerSideApply=true
