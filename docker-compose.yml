# Local development stack. Each service is built from its sibling repository, so the
# expected checkout layout is:
#
#   pulso/
#     pulso-platform/        <- this repo
#     pulso-orders-api/
#     pulso-matching/
#     pulso-support-agents/
#     pulso-saga/
#
# Every value has a default; copy .env.example to .env only to override them.
name: pulso

# Same hardening as the Kubernetes manifests: read-only root fs, no capabilities,
# no privilege escalation, writable /tmp only.
x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: ["ALL"]
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

x-healthcheck-timing: &healthcheck-timing
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 20s

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulso-dev-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./k8s/overlays/dev/data/postgres-init.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      <<: *healthcheck-timing
    restart: unless-stopped

  redis:
    image: redis:7.2.5-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *healthcheck-timing
    restart: unless-stopped

  orders-api:
    <<: *hardening
    build:
      context: ../pulso-orders-api
    image: ghcr.io/pulso/pulso-orders-api:dev
    environment:
      PORT: "3000"
      NODE_ENV: development
      LOG_LEVEL: debug
      DEFAULT_CURRENCY: MXN
      EVENTS_STREAM: pulso.events
      DATABASE_URL: postgres://${POSTGRES_USER:-pulso}:${POSTGRES_PASSWORD:-pulso-dev-only}@postgres:5432/orders
      REDIS_URL: redis://redis:6379/0
      PAYMENT_PROVIDER_API_KEY: ${PAYMENT_PROVIDER_API_KEY:-sk_test_dummy}
    ports:
      - "${ORDERS_API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Slim runtime images ship without curl/wget, so probe with the runtime itself.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      <<: *healthcheck-timing

  matching:
    <<: *hardening
    build:
      context: ../pulso-matching
    image: ghcr.io/pulso/pulso-matching:dev
    environment:
      PORT: "8000"
      LOG_LEVEL: debug
      WEB_CONCURRENCY: "1"
      MATCHING_MAX_RADIUS_KM: "8"
      REDIS_URL: redis://redis:6379/1
    ports:
      - "${MATCHING_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      <<: *healthcheck-timing

  support-agents:
    <<: *hardening
    build:
      context: ../pulso-support-agents
    image: ghcr.io/pulso/pulso-support-agents:dev
    environment:
      PORT: "8080"
      LOG_LEVEL: debug
      WEB_CONCURRENCY: "1"
      ORDERS_API_URL: http://orders-api:3000
      DATABASE_URL: postgres://${POSTGRES_USER:-pulso}:${POSTGRES_PASSWORD:-pulso-dev-only}@postgres:5432/support
      REDIS_URL: redis://redis:6379/2
      LLM_API_KEY: ${LLM_API_KEY:-dummy-llm-key}
    ports:
      - "${SUPPORT_AGENTS_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      orders-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      <<: *healthcheck-timing

  saga:
    <<: *hardening
    build:
      context: ../pulso-saga
    image: ghcr.io/pulso/pulso-saga:dev
    environment:
      PORT: "8090"
      NODE_ENV: development
      LOG_LEVEL: debug
      ORDERS_API_URL: http://orders-api:3000
      MATCHING_URL: http://matching:8000
      EVENTS_STREAM: pulso.events
      PAYMENT_TIMEOUT_SECONDS: "30"
      DATABASE_URL: postgres://${POSTGRES_USER:-pulso}:${POSTGRES_PASSWORD:-pulso-dev-only}@postgres:5432/saga
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${SAGA_PORT:-8090}:8090"
    # The orchestrator calls both services synchronously, so it waits until they are healthy.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      orders-api:
        condition: service_healthy
      matching:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      <<: *healthcheck-timing

volumes:
  postgres-data:
  redis-data:
