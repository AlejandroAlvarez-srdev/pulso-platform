# Local development stack. Each service is built from its sibling repository, so the
# expected checkout layout is:
#
#   pulso/
#     pulso-platform/        <- this repo
#     pulso-orders-api/
#     pulso-matching/
#     pulso-support-agents/
#     pulso-saga/
#
# Every value has a default; copy .env.example to .env only to override them.
name: pulso

# Same hardening as the Kubernetes manifests: read-only root fs, no capabilities,
# no privilege escalation, writable /tmp only.
x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: ["ALL"]
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

x-healthcheck-timing: &healthcheck-timing
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 20s

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulso-dev-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./k8s/overlays/dev/data/postgres-init.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      <<: *healthcheck-timing
    restart: unless-stopped

  redis:
    image: redis:7.2.5-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *healthcheck-timing
    restart: unless-stopped

  # One-shot: Prisma migrations + idempotent demo seed, from the repo's "build" stage
  # (the runtime image has no Prisma CLI). orders-api starts only after it succeeds.
  orders-migrate:
    <<: *hardening
    build:
      context: ../pulso-orders-api
      target: build
    image: ghcr.io/pulso/pulso-orders-api-migrate:dev
    command: ["sh", "-c", "npx prisma migrate deploy && npm run db:seed"]
    environment:
      HOME: /tmp
      DATABASE_URL: postgresql://${POSTGRES_USER:-pulso}:${POSTGRES_PASSWORD:-pulso-dev-only}@postgres:5432/orders?schema=public
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  orders-api:
    <<: *hardening
    build:
      context: ../pulso-orders-api
    image: ghcr.io/pulso/pulso-orders-api:dev
    environment:
      PORT: "3000"
      NODE_ENV: development
      PERSISTENCE: prisma
      DATABASE_URL: postgresql://${POSTGRES_USER:-pulso}:${POSTGRES_PASSWORD:-pulso-dev-only}@postgres:5432/orders?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-not-for-production}
      JWT_ISSUER: pulso-orders-api
    ports:
      - "${ORDERS_API_PORT:-3000}:3000"
    depends_on:
      orders-migrate:
        condition: service_completed_successfully
    # Slim runtime images ship without curl/wget, so probe with the runtime itself.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      <<: *healthcheck-timing

  matching:
    <<: *hardening
    build:
      context: ../pulso-matching
    image: ghcr.io/pulso/pulso-matching:dev
    environment:
      WEB_CONCURRENCY: "1"
      PULSO_MAX_RADIUS_KM: "8"
      PULSO_MAX_ETA_MINUTES: "45"
    ports:
      - "${MATCHING_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      <<: *healthcheck-timing

  support-agents:
    <<: *hardening
    build:
      context: ../pulso-support-agents
    image: ghcr.io/pulso/pulso-support-agents:dev
    environment:
      WEB_CONCURRENCY: "1"
      PULSO_LLM_PROVIDER: ${PULSO_LLM_PROVIDER:-scripted}
      PULSO_CHECKPOINT_DB: /data/threads.sqlite
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-dummy-anthropic-key}
    # The image listens on :8000 (same as matching), so it is published on host port 8080.
    ports:
      - "${SUPPORT_AGENTS_PORT:-8080}:8000"
    volumes:
      - support-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      <<: *healthcheck-timing

  saga:
    <<: *hardening
    build:
      context: ../pulso-saga
    image: ghcr.io/pulso/pulso-saga:dev
    environment:
      # The orchestrator defaults to :3000 (taken by orders-api); PORT moves it to 8090.
      PORT: "8090"
      NODE_ENV: development
      REDIS_URL: redis://redis:6379/0
      STEP_TIMEOUT_MS: "15000"
      MAX_COMPENSATION_ATTEMPTS: "5"
    ports:
      - "${SAGA_PORT:-8090}:8090"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      <<: *healthcheck-timing

  # Saga participants (payments, matching, merchant) simulated over Redis Streams, so the
  # orchestrator has something to talk to locally. Reuses the image built for "saga".
  saga-participants:
    <<: *hardening
    image: ghcr.io/pulso/pulso-saga:dev
    pull_policy: never
    command: ["node", "dist/apps/fake-services.js"]
    environment:
      REDIS_URL: redis://redis:6379/0
      PAYMENT_FAILURE_RATE: "0.2"
      PULSERS: "50"
    depends_on:
      saga:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  support-data:
